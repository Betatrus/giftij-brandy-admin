name: Cloudflare migration readiness (Admin)

on:
  push:
    branches:
      - cloudflare/migration-prep
  pull_request:
    branches:
      - cloudflare/migration-prep

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
